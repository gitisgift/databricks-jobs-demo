bundle:
  name: bundle-demo

variables:
  env:
    description: Environment
    default: dev

  wheel_file:
    description: Wheel file name
    default: ""

  release_version:
    description: Git release or commit
    default: ""

targets:
  dev:
    mode: development
    workspace:
      host: https://adb-7405610998143352.12.azuredatabricks.net/
    variables:
      env: dev


  # We have only one workspace
  # qa:
  #   mode: production
  #   workspace:
  #     host: https://adb-qa.example.com
  #   variables:
  #     env: qa

  # prod:
  #   mode: production
  #   workspace:
  #     host: https://adb-prod.example.com
  #   variables:
  #     env: prod

resources:

    
  jobs:

    notebook_wheel_job:
      name: notebook-wheel-${var.env}

      parameters:
        - name: run_env
          default: dev
        - name: release
          default: unknown

      schedule:
        quartz_cron_expression: "0 0 * * * ?"
        timezone_id: UTC

      email_notifications:
        on_failure:
          - test@test.com

      job_clusters:
        - job_cluster_key: sql_cluster
          new_cluster:
            spark_version: 14.3.x-scala2.12
            node_type_id: Standard_DS3_v2
            autoscale:
              min_workers: 1
              max_workers: 4
            spark_conf:
              spark.sql.shuffle.partitions: "100"

      tasks:
        - task_key: run_logic
          job_cluster_key: sql_cluster
          spark_python_task:
            python_file: notebooks/job1_task.py
            base_parameters:
              env: ${var.env}
              release: ${var.release_version}
          libraries:
            - whl: dist/${var.wheel_file}
          max_retries: 2
          retry_on_timeout: true

    
    notebook_sql_job:
      name: notebook-sql-${var.env}
      max_concurrent_runs: 1

      schedule:
        quartz_cron_expression: "0 30 * * * ?"
        timezone_id: UTC

      email_notifications:
        on_failure:
          - test@test.com

      job_clusters:
        - job_cluster_key: job_cluster
          new_cluster:
            spark_version: 14.3.x-scala2.12
            node_type_id: Standard_DS5_v2
            autoscale:
              min_workers: 2
              max_workers: 8
            spark_conf:
              spark.sql.shuffle.partitions: "200"
              spark.databricks.delta.schema.autoMerge.enabled: "true"

      tasks:
        - task_key: apply_sql
          job_cluster_key: job_cluster
          # existing_cluster_id: 0123-456789-abcd123
          # notebook_task:
          spark_python_task:
            python_file: notebooks/job2_task.py
            base_parameters:
              sql_file: sql/user_schema.sql
              release: ${var.release_version}
          max_retries: 1

        - task_key: validate
          depends_on:
            - task_key: apply_sql
          job_cluster_key: shared
          spark_python_task:
            python_file: notebooks/validate.py
          max_retries: 0
