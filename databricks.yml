bundle:
  name: databricks-notebook-platform

variables:
  env:
    description: Deployment environment
  catalog:
    description: Unity Catalog for this environment

targets:
  dev:
    mode: development
    workspace:
      host: https://adb-7405610998143352.12.azuredatabricks.net/
    variables:
      env: dev
      catalog: dev

  # prod:
  #   mode: production
  #   workspace:
  #     host: https://adb-<WORKSPACE-ID>.azuredatabricks.net
  #   variables:
  #     env: prod
  #     catalog: uc_prod

resources:
  jobs:
    customer_etl_job:
      name: customer-etl-${var.env}

      tags:
        environment: ${var.env}
        git_commit: ${bundle.git.commit}

      tasks:
        - task_key: customer_etl
          job_cluster_key: shared_cluster

          notebook_task:
            notebook_path: notebooks/customer_etl.py
            base_parameters:
              catalog: ${var.catalog}
              source: job
              limit: "50"

      job_clusters:
        - job_cluster_key: shared_cluster
          new_cluster:
            spark_version: 14.3.x-scala2.12
            node_type_id: Standard_DS3_v2
            num_workers: 2
